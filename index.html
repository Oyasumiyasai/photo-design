<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>プロンプトメモ & レイアウト管理</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .line-clamp-3 {
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-12">

    <!-- ヘッダー（新規プロンプト追加ボタン & 設定ボタン） -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-4">
            <!-- 左側：新規プロンプト追加ボタン -->
            <button onclick="openPromptModal()" class="inline-flex items-center gap-2 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold px-4 py-2.5 rounded-xl shadow-sm transition-all text-sm active:scale-95">
                <i class="fa-solid fa-plus text-base"></i>
                <span>新規プロンプト追加</span>
            </button>

            <!-- 右側：同期ステータス & GAS設定ボタン -->
            <div class="flex items-center gap-3">
                <div id="syncStatus" class="hidden sm:flex items-center gap-2 text-xs font-medium text-slate-500 bg-slate-100 px-3 py-1.5 rounded-lg border border-slate-200">
                    <span id="syncStatusDot" class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                    <span id="syncStatusText">スプレッドシート連携済み</span>
                </div>
                <button onclick="openSettingsModal()" class="p-2.5 text-slate-600 hover:text-slate-900 hover:bg-slate-100 rounded-xl transition-colors" title="GAS連携設定">
                    <i class="fa-solid fa-gear text-lg"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- メインコンテンツ -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-6">
        
        <!-- 検索・フィルター領域 -->
        <div class="flex flex-col md:flex-row gap-4 mb-6 items-center justify-between">
            <!-- カテゴリタブ -->
            <div class="flex items-center gap-2 overflow-x-auto w-full md:w-auto pb-2 md:pb-0 scrollbar-none" id="categoryFilterContainer">
                <!-- JSで動的生成 -->
            </div>

            <!-- 検索窓 -->
            <div class="relative w-full md:w-72">
                <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                <input type="text" id="searchInput" oninput="renderPrompts()" placeholder="プロンプトやタグを検索..." 
                    class="w-full pl-10 pr-4 py-2 bg-white border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all">
            </div>
        </div>

        <!-- プロンプトタイル（独立したカード一覧） -->
        <div id="promptGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- JSで動的に個別のカードが描画されます -->
        </div>

        <!-- データ空の場合の表示 -->
        <div id="emptyState" class="hidden flex-col items-center justify-center py-16 text-center">
            <div class="w-16 h-16 bg-slate-100 text-slate-400 rounded-full flex items-center justify-center mb-4">
                <i class="fa-solid fa-folder-open text-2xl"></i>
            </div>
            <h3 class="text-base font-semibold text-slate-700 mb-1">プロンプトが見つかりません</h3>
            <p class="text-sm text-slate-500 max-w-sm mb-4">新規追加ボタンから新しいプロンプトを登録してください。</p>
            <button onclick="openPromptModal()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-4 py-2 rounded-lg text-sm">
                プロンプトを作成する
            </button>
        </div>
    </main>

    <!-- プロンプト追加/編集 モーダル -->
    <div id="promptModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4 overflow-y-auto">
        <div class="bg-white rounded-2xl max-w-xl w-full p-6 shadow-xl border border-slate-100 my-8">
            <div class="flex items-center justify-between pb-4 border-b border-slate-100 mb-5">
                <h3 id="modalTitle" class="text-lg font-bold text-slate-800">新規プロンプトの作成</h3>
                <button onclick="closePromptModal()" class="text-slate-400 hover:text-slate-600 p-1.5 rounded-lg hover:bg-slate-100 transition-colors">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <form id="promptForm" onsubmit="handleFormSubmit(event)" class="space-y-4">
                <input type="hidden" id="editPromptId">

                <!-- タイトル -->
                <div>
                    <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1.5">タイトル <span class="text-rose-500">*</span></label>
                    <input type="text" id="promptTitleInput" required placeholder="例: ポートレート構図・ライティング" 
                        class="w-full px-3.5 py-2.5 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500">
                </div>

                <!-- カテゴリ & タグ -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1.5">カテゴリ</label>
                        <select id="promptCategoryInput" class="w-full px-3.5 py-2.5 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 bg-white">
                            <option value="人物・ポーズ">人物・ポーズ</option>
                            <option value="レイアウト・構図">レイアウト・構図</option>
                            <option value="背景・風景">背景・風景</option>
                            <option value="照明・シネマ">照明・シネマ</option>
                            <option value="スタイル・画風">スタイル・画風</option>
                            <option value="その他" selected>その他</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1.5">タグ (カンマ区切り)</label>
                        <input type="text" id="promptTagsInput" placeholder="例: 屋外, 8k, シネマティック" 
                            class="w-full px-3.5 py-2.5 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500">
                    </div>
                </div>

                <!-- プロンプト本文 -->
                <div>
                    <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1.5">プロンプト本文 <span class="text-rose-500">*</span></label>
                    <textarea id="promptContentInput" rows="4" required placeholder="Generate a high quality photograph of..." 
                        class="w-full px-3.5 py-2.5 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 font-mono text-xs leading-relaxed"></textarea>
                </div>

                <!-- メモ -->
                <div>
                    <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1.5">メモ・注意事項</label>
                    <input type="text" id="promptNoteInput" placeholder="パラメータ設定や使い方の補足" 
                        class="w-full px-3.5 py-2.5 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500">
                </div>

                <!-- 参考画像 (URL または ファイルアップロード) -->
                <div>
                    <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1.5">参考画像 (URL または ファイル選択)</label>
                    <div class="flex gap-2 mb-2">
                        <input type="url" id="promptImageUrlInput" placeholder="https://example.com/image.jpg" onchange="previewImageFromUrl()"
                            class="w-full px-3.5 py-2 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500">
                        <label class="shrink-0 bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-2 rounded-xl text-xs font-medium cursor-pointer border border-slate-200 flex items-center gap-1.5">
                            <i class="fa-solid fa-upload"></i>
                            <span>画像選択</span>
                            <input type="file" id="imageFileInput" accept="image/*" onchange="handleFileSelect(event)" class="hidden">
                        </label>
                    </div>
                    <!-- プレビュー -->
                    <div id="imagePreviewContainer" class="hidden relative rounded-xl overflow-hidden border border-slate-200 h-32 bg-slate-100">
                        <img id="imagePreview" src="" class="w-full h-full object-cover">
                        <button type="button" onclick="clearImagePreview()" class="absolute top-2 right-2 bg-slate-900/70 text-white w-6 h-6 rounded-full flex items-center justify-center hover:bg-slate-900">
                            <i class="fa-solid fa-xmark text-xs"></i>
                        </button>
                    </div>
                </div>

                <!-- フッターボタン -->
                <div class="flex items-center justify-end gap-3 pt-4 border-t border-slate-100">
                    <button type="button" onclick="closePromptModal()" class="px-4 py-2 text-sm font-medium text-slate-600 hover:bg-slate-100 rounded-xl transition-colors">
                        キャンセル
                    </button>
                    <button type="submit" class="px-5 py-2 text-sm font-medium bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl shadow-sm transition-all">
                        保存する
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- GAS 設定モーダル -->
    <div id="settingsModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-xl border border-slate-100">
            <div class="flex items-center justify-between pb-4 border-b border-slate-100 mb-5">
                <h3 class="text-lg font-bold text-slate-800">Google スプレッドシート連携</h3>
                <button onclick="closeSettingsModal()" class="text-slate-400 hover:text-slate-600 p-1.5 rounded-lg hover:bg-slate-100">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            <div class="space-y-4">
                <p class="text-xs text-slate-600 leading-relaxed">
                    デプロイした GAS (Google Apps Script) のウェブアプリ URL を設定すると、Google スプレッドシートとデータを完全同期できます。
                </p>
                <div>
                    <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1.5">GAS Web App URL</label>
                    <input type="text" id="gasUrlInput" placeholder="https://script.google.com/macros/s/.../exec" 
                        class="w-full px-3.5 py-2.5 border border-slate-200 rounded-xl text-xs font-mono focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500">
                </div>
                <div class="flex items-center justify-end gap-3 pt-2">
                    <button onclick="saveGasSettings()" class="w-full py-2.5 text-sm font-medium bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl shadow-sm transition-all">
                        URLを保存して同期
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- トースト通知 -->
    <div id="toast" class="fixed bottom-6 right-6 bg-slate-900 text-white text-xs font-medium px-4 py-3 rounded-xl shadow-lg z-50 transform translate-y-10 opacity-0 pointer-events-none transition-all duration-300 flex items-center gap-2">
        <i id="toastIcon" class="fa-solid fa-circle-check text-emerald-400 text-sm"></i>
        <span id="toastMessage">コピーしました</span>
    </div>

    <script>
        // デフォルトGAS URL
        const DEFAULT_GAS_URL = 'https://script.google.com/macros/s/AKfycbyfLxct_Hx4PX6FvvEZrAAbzpfK5SDc-fauoHpPCx6bX86U9CoXY7o-YXykCcqdY9Bi/exec';
        
        let GAS_WEB_APP_URL = localStorage.getItem('GAS_WEB_APP_URL') || DEFAULT_GAS_URL;
        let prompts = [];
        let currentCategory = 'すべて';

        // 初期プロンプトサンプルデータ
        const defaultPrompts = [
            {
                id: 'sample-1',
                title: 'シネマティックポートレート',
                category: '人物・ポーズ',
                tags: ['人物', 'シネマティック', '8k'],
                prompt: 'Cinematic portrait of a young woman standing in neon-lit city street at night, shallow depth of field, 85mm lens, atmospheric lighting, high detail, photorealistic --ar 16:9',
                note: 'MidjourneyやStable Diffusionにおすすめ',
                imageUrl: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=600&q=80',
                updatedAt: new Date().toISOString()
            }
        ];

        window.addEventListener('DOMContentLoaded', () => {
            document.getElementById('gasUrlInput').value = GAS_WEB_APP_URL;
            loadPrompts();
        });

        // データの読み込み (GAS優先 -> LocalStorageバックアップ)
        async function loadPrompts() {
            if (GAS_WEB_APP_URL) {
                await fetchPromptsFromGAS();
            } else {
                loadFromLocalStorage();
            }
        }

        // LocalStorageからの読み込み
        function loadFromLocalStorage() {
            const saved = localStorage.getItem('PROMPTS_DATA');
            if (saved) {
                try {
                    prompts = JSON.parse(saved);
                } catch(e) {
                    prompts = [...defaultPrompts];
                }
            } else {
                prompts = [...defaultPrompts];
            }
            renderCategories();
            renderPrompts();
        }

        // GASから全プロンプトを取得（最新順を保持）
        async function fetchPromptsFromGAS() {
            const syncStatusText = document.getElementById('syncStatusText');
            const syncStatusDot = document.getElementById('syncStatusDot');
            
            syncStatusText.textContent = '同期中...';
            syncStatusDot.className = 'w-2 h-2 rounded-full bg-amber-500 animate-ping';

            try {
                const response = await fetch(`${GAS_WEB_APP_URL}?action=getAll`);
                const res = await response.json();
                
                if (res.status === 'success' && Array.isArray(res.data)) {
                    if (res.data.length === 0) {
                        prompts = [...defaultPrompts];
                        await saveAllPromptsToGAS(prompts);
                    } else {
                        // GASからのデータを逆順にして最新が先頭に来るようにセット
                        prompts = res.data.reverse();
                    }
                    saveToLocalStorage();
                    syncStatusText.textContent = 'GAS完全同期済み';
                    syncStatusDot.className = 'w-2 h-2 rounded-full bg-emerald-500';
                } else {
                    throw new Error(res.message || '取得失敗');
                }
            } catch (err) {
                console.warn('GAS Fetch Error:', err);
                syncStatusText.textContent = 'オフライン（ローカル）';
                syncStatusDot.className = 'w-2 h-2 rounded-full bg-slate-400';
                loadFromLocalStorage();
            }
            renderCategories();
            renderPrompts();
        }

        // カテゴリボタン描画
        function renderCategories() {
            const container = document.getElementById('categoryFilterContainer');
            const categories = ['すべて', '人物・ポーズ', 'レイアウト・構図', '背景・風景', '照明・シネマ', 'スタイル・画風', 'その他'];
            
            container.innerHTML = categories.map(cat => `
                <button onclick="setCategory('${cat}')" 
                    class="px-3.5 py-1.5 rounded-xl text-xs font-medium whitespace-nowrap transition-all ${
                        currentCategory === cat 
                        ? 'bg-slate-900 text-white shadow-sm' 
                        : 'bg-white text-slate-600 hover:bg-slate-100 border border-slate-200'
                    }">
                    ${cat}
                </button>
            `).join('');
        }

        function setCategory(cat) {
            currentCategory = cat;
            renderCategories();
            renderPrompts();
        }

        // タイル形式（独立したカード）一覧の描画
        function renderPrompts() {
            const grid = document.getElementById('promptGrid');
            const emptyState = document.getElementById('emptyState');
            const searchKeyword = document.getElementById('searchInput').value.toLowerCase().trim();

            const filtered = prompts.filter(item => {
                const matchCategory = (currentCategory === 'すべて' || item.category === currentCategory);
                const matchSearch = !searchKeyword || 
                    item.title.toLowerCase().includes(searchKeyword) ||
                    item.prompt.toLowerCase().includes(searchKeyword) ||
                    (item.tags && item.tags.some(t => t.toLowerCase().includes(searchKeyword)));
                return matchCategory && matchSearch;
            });

            if (filtered.length === 0) {
                grid.innerHTML = '';
                emptyState.classList.remove('hidden');
                emptyState.classList.add('flex');
                return;
            }

            emptyState.classList.add('hidden');
            emptyState.classList.remove('flex');

            // タイルひとつひとつを確実に独立して描画（マトリョーシカ状の入れ子を完全解消）
            grid.innerHTML = filtered.map(item => `
                <div class="bg-white rounded-2xl border border-slate-200/80 shadow-sm hover:shadow-md transition-all duration-200 flex flex-col overflow-hidden group">
                    <!-- 画像エリア -->
                    ${item.imageUrl ? `
                        <div class="relative w-full h-44 bg-slate-100 overflow-hidden border-b border-slate-100">
                            <img src="${item.imageUrl}" alt="${escapeHtml(item.title)}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300" onerror="this.parentElement.style.display='none'">
                        </div>
                    ` : ''}

                    <div class="p-5 flex-1 flex flex-col justify-between gap-4">
                        <div class="space-y-3">
                            <!-- カテゴリ & 編集/削除 -->
                            <div class="flex items-center justify-between gap-2">
                                <span class="px-2.5 py-0.5 rounded-md text-[11px] font-semibold bg-indigo-50 text-indigo-600 border border-indigo-100/60">
                                    ${escapeHtml(item.category || 'その他')}
                                </span>
                                <div class="flex items-center gap-1 opacity-80 group-hover:opacity-100 transition-opacity">
                                    <button onclick="editPrompt('${item.id}')" class="p-1.5 text-slate-400 hover:text-indigo-600 rounded-lg hover:bg-slate-100 transition-colors" title="編集">
                                        <i class="fa-solid fa-pen text-xs"></i>
                                    </button>
                                    <button onclick="deletePromptItem('${item.id}')" class="p-1.5 text-slate-400 hover:text-rose-600 rounded-lg hover:bg-slate-100 transition-colors" title="削除">
                                        <i class="fa-solid fa-trash text-xs"></i>
                                    </button>
                                </div>
                            </div>

                            <!-- タイトル -->
                            <h4 class="text-base font-bold text-slate-800 leading-snug">${escapeHtml(item.title)}</h4>

                            <!-- プロンプト本文 -->
                            <div class="bg-slate-50 border border-slate-200/70 rounded-xl p-3">
                                <p class="font-mono text-xs text-slate-700 leading-relaxed line-clamp-3 select-all">${escapeHtml(item.prompt)}</p>
                            </div>

                            <!-- メモやタグ（存在する場合） -->
                            ${item.note ? `
                                <p class="text-xs text-slate-500 italic"><i class="fa-regular fa-note-sticky mr-1"></i>${escapeHtml(item.note)}</p>
                            ` : ''}

                            ${item.tags && item.tags.length > 0 ? `
                                <div class="flex flex-wrap gap-1 pt-1">
                                    ${item.tags.map(tag => `<span class="text-[10px] bg-slate-100 text-slate-600 px-2 py-0.5 rounded-full">#${escapeHtml(tag)}</span>`).join('')}
                                </div>
                            ` : ''}
                        </div>

                        <!-- アクションボタングループ (コピー, Gemini, ChatGPT) -->
                        <div class="pt-3 border-t border-slate-100 flex items-center gap-1.5">
                            <button onclick="copyPromptText('${escapeJs(item.prompt)}')" class="flex-1 inline-flex items-center justify-center gap-1 bg-slate-900 hover:bg-slate-800 text-white font-medium py-2 px-2.5 rounded-xl text-xs transition-all shadow-sm active:scale-95" title="クリップボードにコピー">
                                <i class="fa-regular fa-copy"></i>
                                <span>コピー</span>
                            </button>
                            <button onclick="openInGemini('${escapeJs(item.prompt)}')" class="flex-1 inline-flex items-center justify-center gap-1 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-semibold py-2 px-2 rounded-xl text-xs transition-all border border-indigo-200/60 active:scale-95" title="プロンプトをコピーしてGeminiを開く">
                                <i class="fa-solid fa-sparkles text-indigo-600"></i>
                                <span>Gemini</span>
                            </button>
                            <button onclick="openInChatGPT('${escapeJs(item.prompt)}')" class="flex-1 inline-flex items-center justify-center gap-1 bg-emerald-50 hover:bg-emerald-100 text-emerald-700 font-semibold py-2 px-2 rounded-xl text-xs transition-all border border-emerald-200/60 active:scale-95" title="プロンプトをコピーしてChatGPTを開く">
                                <i class="fa-solid fa-robot text-emerald-600"></i>
                                <span>ChatGPT</span>
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // プロンプトをコピーして Gemini Webサイトへ移動
        function openInGemini(text) {
            copyToClipboard(text);
            showToast('コピーしました！Geminiを開きます');
            const targetUrl = 'https://gemini.google.com/?q=' + encodeURIComponent(text);
            setTimeout(() => {
                window.open(targetUrl, '_blank');
            }, 400);
        }

        // プロンプトをコピーして ChatGPT Webサイトへ移動（URLパラメータでプロンプトを自動セット）
        function openInChatGPT(text) {
            copyToClipboard(text);
            showToast('コピーしました！ChatGPTを開きます');
            const targetUrl = 'https://chatgpt.com/?q=' + encodeURIComponent(text);
            setTimeout(() => {
                window.open(targetUrl, '_blank');
            }, 400);
        }

        // プロンプトテキストのみコピー
        function copyPromptText(text) {
            copyToClipboard(text);
            showToast('クリップボードにコピーしました');
        }

        // クリップボードコピー実行 (iFrame対応の安全処理)
        function copyToClipboard(text) {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.top = "0";
            textArea.style.left = "0";
            textArea.style.position = "fixed";
            textArea.style.opacity = "0";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();

            try {
                const successful = document.execCommand('copy');
                if (!successful && navigator.clipboard) {
                    navigator.clipboard.writeText(text).catch(() => {});
                }
            } catch (err) {
                if (navigator.clipboard) {
                    navigator.clipboard.writeText(text).catch(() => {});
                }
            } finally {
                document.body.removeChild(textArea);
            }
        }

        // モーダルの開閉
        function openPromptModal(isEdit = false) {
            if (!isEdit) {
                document.getElementById('editPromptId').value = '';
                document.getElementById('modalTitle').textContent = '新規プロンプトの作成';
                document.getElementById('promptForm').reset();
                clearImagePreview();
            }
            document.getElementById('promptModal').classList.remove('hidden');
        }

        function closePromptModal() {
            document.getElementById('promptModal').classList.add('hidden');
        }

        // プロンプト保存処理（★新規データは常に配列の最上部（先頭）に追加）
        async function handleFormSubmit(e) {
            e.preventDefault();

            const editId = document.getElementById('editPromptId').value;
            const title = document.getElementById('promptTitleInput').value.trim();
            const category = document.getElementById('promptCategoryInput').value;
            const tagsStr = document.getElementById('promptTagsInput').value.trim();
            const prompt = document.getElementById('promptContentInput').value.trim();
            const note = document.getElementById('promptNoteInput').value.trim();
            const imageUrl = document.getElementById('promptImageUrlInput').value.trim();

            const tags = tagsStr ? tagsStr.split(',').map(t => t.trim()).filter(Boolean) : [];

            const promptData = {
                id: editId || Date.now().toString(),
                title,
                category,
                tags,
                prompt,
                note,
                imageUrl,
                updatedAt: new Date().toISOString()
            };

            if (editId) {
                // 既存更新
                const index = prompts.findIndex(p => p.id === editId);
                if (index !== -1) prompts[index] = promptData;
            } else {
                // ★ 新規追加：常に最上部（配列の先頭 index:0）に追加
                prompts.unshift(promptData);
            }

            saveToLocalStorage();
            renderPrompts();
            closePromptModal();
            showToast(editId ? '更新しました' : '先頭に追加しました');

            // GASと同期
            if (GAS_WEB_APP_URL) {
                savePromptToGAS(promptData);
            }
        }

        // GASへの保存リクエスト
        async function savePromptToGAS(promptData) {
            try {
                await fetch(GAS_WEB_APP_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        action: 'save',
                        prompt: promptData
                    })
                });
            } catch (err) {
                console.error('GAS Save Error:', err);
            }
        }

        // プロンプト編集
        function editPrompt(id) {
            const item = prompts.find(p => p.id === id);
            if (!item) return;

            document.getElementById('editPromptId').value = item.id;
            document.getElementById('modalTitle').textContent = 'プロンプトの編集';
            document.getElementById('promptTitleInput').value = item.title;
            document.getElementById('promptCategoryInput').value = item.category || 'その他';
            document.getElementById('promptTagsInput').value = item.tags ? item.tags.join(', ') : '';
            document.getElementById('promptContentInput').value = item.prompt;
            document.getElementById('promptNoteInput').value = item.note || '';
            document.getElementById('promptImageUrlInput').value = item.imageUrl || '';

            if (item.imageUrl) {
                document.getElementById('imagePreview').src = item.imageUrl;
                document.getElementById('imagePreviewContainer').classList.remove('hidden');
            } else {
                clearImagePreview();
            }

            openPromptModal(true);
        }

        // プロンプト削除
        async function deletePromptItem(id) {
            if (!confirm('このプロンプトを削除してもよろしいですか？')) return;

            prompts = prompts.filter(p => p.id !== id);
            saveToLocalStorage();
            renderPrompts();
            showToast('削除しました');

            if (GAS_WEB_APP_URL) {
                try {
                    await fetch(GAS_WEB_APP_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ action: 'delete', id: id })
                    });
                } catch(err) {
                    console.error('GAS Delete Error:', err);
                }
            }
        }

        // 画像プレビュー関連
        function previewImageFromUrl() {
            const url = document.getElementById('promptImageUrlInput').value.trim();
            if (url) {
                document.getElementById('imagePreview').src = url;
                document.getElementById('imagePreviewContainer').classList.remove('hidden');
            } else {
                clearImagePreview();
            }
        }

        function handleFileSelect(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(evt) {
                const base64 = evt.target.result;
                document.getElementById('promptImageUrlInput').value = base64;
                document.getElementById('imagePreview').src = base64;
                document.getElementById('imagePreviewContainer').classList.remove('hidden');
            };
            reader.readAsDataURL(file);
        }

        function clearImagePreview() {
            document.getElementById('promptImageUrlInput').value = '';
            document.getElementById('imageFileInput').value = '';
            document.getElementById('imagePreview').src = '';
            document.getElementById('imagePreviewContainer').classList.add('hidden');
        }

        // LocalStorageへの一括保存
        function saveToLocalStorage() {
            localStorage.setItem('PROMPTS_DATA', JSON.stringify(prompts));
        }

        // GAS全データ上書き保存
        async function saveAllPromptsToGAS(dataArray) {
            if (!GAS_WEB_APP_URL) return;
            try {
                await fetch(GAS_WEB_APP_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'saveAll', prompts: dataArray })
                });
            } catch(e) {
                console.error(e);
            }
        }

        // GAS設定モーダル
        function openSettingsModal() {
            document.getElementById('settingsModal').classList.remove('hidden');
        }
        function closeSettingsModal() {
            document.getElementById('settingsModal').classList.add('hidden');
        }
        function saveGasSettings() {
            const url = document.getElementById('gasUrlInput').value.trim();
            GAS_WEB_APP_URL = url;
            localStorage.setItem('GAS_WEB_APP_URL', url);
            closeSettingsModal();
            showToast('GAS URL設定を保存しました');
            fetchPromptsFromGAS();
        }

        // ユーティリティ
        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMessage').textContent = msg;
            toast.classList.remove('translate-y-10', 'opacity-0', 'pointer-events-none');
            setTimeout(() => {
                toast.classList.add('translate-y-10', 'opacity-0', 'pointer-events-none');
            }, 2500);
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>"']/g, m => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            })[m]);
        }

        function escapeJs(str) {
            if (!str) return '';
            return str.replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '\\"').replace(/\n/g, '\\n');
        }
    </script>
</body>
</html>
